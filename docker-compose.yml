version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edge_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-edge_analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edge_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: edge_storage
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  create_buckets:
    image: minio/mc:latest
    container_name: edge_storage_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local_s3 http://minio:9000 admin minio_password;
      /usr/bin/mc mb --ignore-existing local_s3/anomaly-frames;
      /usr/bin/mc anonymous set download local_s3/anomaly-frames;
      exit 0;
      "

  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: api_gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=edge_analytics
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis_password
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=minio_password
      - S3_BUCKET_NAME=anomaly-frames
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  vision_pipeline:
    build:
      context: .
      dockerfile: services/vision_pipeline/Dockerfile
    container_name: vision_pipeline
    environment:
      - ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis_password
      - RTSP_STREAM_URL=demo_stream
      - USE_CUDA=false
      - INFERENCE_BATCH_SIZE=4
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  stream_processor_worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: stream_processor_worker
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=edge_analytics
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis_password
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=minio_password
      - S3_BUCKET_NAME=anomaly-frames
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: edge_prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: edge_grafana
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: edge_frontend
    ports:
      - "3001:80"
    depends_on:
      - api_gateway

volumes:
  postgres_data:
  redis_data:
  minio_data:
